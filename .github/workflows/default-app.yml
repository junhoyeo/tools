name: default-app

on:
  pull_request:
    paths:
      - "default-app/**"
      - ".github/workflows/default-app.yml"
  push:
    branches: [main]
    paths:
      - "default-app/**"
      - ".github/workflows/default-app.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    # `set` does not return while macOS waits for an answer to its confirmation dialog.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: default-app
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release
      - run: swift test
      - name: Check the commands on the runner
        run: |
          bin=.build/release/default-app
          "$bin" probe md ./Makefile ./Dockerfile

          # `set` must accept every name in the list.
          "$bin" probe < code-files.txt > "$RUNNER_TEMP/list.tsv"
          if cut -f 2 "$RUNNER_TEMP/list.tsv" | grep -x -e - -e public.data; then
            echo "the list has a name that set refuses"
            exit 1
          fi

          # A name that macOS does not know is refused, and nothing changes.
          before=$("$bin" probe ./Dockerfile)
          if "$bin" set com.apple.Safari ./Dockerfile; then
            echo "set must refuse a name that macOS does not know"
            exit 1
          fi
          test "$("$bin" probe ./Dockerfile)" = "$before"

          # macOS asks a person to confirm a real change. Only a change to the app that
          # is already the default returns on a runner.
          current=$("$bin" probe md | cut -f 3)
          "$bin" set "$current" md
